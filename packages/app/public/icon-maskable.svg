<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="DSH Mobile">
  <!--
    Variante para iconos "maskable".

    Android recorta estos iconos con formas arbitrarias y solo garantiza el 80%
    central, así que el fondo va a sangre (sin esquinas redondeadas, las pone el
    lanzador) y el contenido se queda dentro de ese círculo seguro.
  -->
  <rect width="192" height="192" fill="#151517" />
  <g transform="translate(96 96) scale(0.72) translate(-96 -96)">
    <rect x="58" y="30" width="76" height="132" rx="14" fill="none" stroke="#4ade80" stroke-width="6" />
    <rect x="84" y="40" width="24" height="6" rx="3" fill="#4ade80" />
    <circle cx="96" cy="140" r="7" fill="#4ade80" />
  </g>
</svg>
