# Capa de patch del plugin DSH Mobile.
#
# Se enlaza desde el perfil con `link:` en package.json y se activa añadiendo el
# bundle a `dsh.profile.bundles`, o bien insertando esta entrada en el
# `cordis.patch.yml` del perfil:
#
#   - insert:
#       - id: dsh-mobile-companion
#         name: '@deepseekharness-mobile/companion'
#         config: {}
#
# El plugin escucha en 127.0.0.1:6768 (loopback fijo: no hay modo de red). La
# autenticación por dispositivo ya existe; para llegar desde un teléfono se
# publica por el nombre del tailnet con `tailscale serve`, que sí alcanza el
# loopback y aporta HTTPS. La LAN directa no está soportada.

- insert:
    - id: dsh-mobile-companion
      name: './dist/index.js'
      config: {}
